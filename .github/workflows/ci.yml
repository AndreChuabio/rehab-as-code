name: CI

# The merge gate. Until this existed, `git push origin main` went straight to
# Vercel (rebuild) and Supabase (auto-applies new migrations) with nothing
# running the 547-test backend suite first.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.11 matches the local venv. System python3 on this project's machine is
      # 3.14; pinning here keeps CI and local from diverging.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Explicit rather than relying on whatever node the runner image ships,
      # so the frontend unit-test step below is deterministic.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Vercel installs from the ROOT requirements.txt, so CI installs from the
      # same file — a dep that works here is a dep that works in the lambda.
      # pytest is a test-only dep and deliberately not in either file.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Documented footgun: two requirements files, and a dep added to only one
      # makes the Vercel lambda 502 with ModuleNotFoundError at runtime — after
      # deploy, not at build. Catch the drift here instead.
      - name: requirements.txt files are in sync
        run: |
          if ! diff -u \
            <(grep -vE '^\s*#|^\s*$' requirements.txt | sort) \
            <(grep -vE '^\s*#|^\s*$' backend/requirements.txt | sort); then
            echo "::error::requirements.txt and backend/requirements.txt have drifted."
            echo "Vercel installs from the root file; local dev installs from backend/."
            echo "A dep in only one of them 502s the lambda at runtime. Sync both."
            exit 1
          fi

      # conftest.py forces STORAGE_BACKEND=sqlite and monkeypatches the psycopg
      # paths, so this needs no DATABASE_URL and never touches Supabase.
      - name: Run backend suite
        run: python -m pytest backend/tests/ -q

      # frontend/tests/*.test.js are dependency-free node scripts that mirror the
      # render helpers inside clinician.js / app.js. They existed but nothing ran
      # them, so a mirror could drift from the real code unnoticed.
      - name: Run frontend unit tests
        run: |
          rc=0
          for f in frontend/tests/*.test.js; do
            if node "$f"; then
              echo "PASS $f"
            else
              echo "::error file=$f::$f failed"
              rc=1
            fi
          done
          exit $rc

  e2e-smoke:
    name: e2e smoke (@public)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install harness dependencies
        run: npm ci

      # Browser download is the slowest step by far; cache it on the resolved
      # Playwright version rather than re-downloading every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Hermetic: playwright.config.ts boots uvicorn itself against sqlite with
      # no DATABASE_URL, so this run cannot reach the production database.
      # QA_ALLOW_MUTATION is never set, so the suite stays read-only regardless.
      #
      # SUPABASE_URL / SUPABASE_ANON_KEY are public-by-design values (the anon
      # key is RLS-gated and already served to any browser by GET /config).
      # They are here only so the /config spec can assert the endpoint serves an
      # `anon` key and never a service_role one.
      - name: Run public smoke suite
        run: npx playwright test --grep @public --project=chromium
        env:
          QA_TARGET: local
          QA_PORT: "8000"
          QA_PYTHON: python3
          STORAGE_BACKEND: sqlite
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Traces/screenshots/video are retained on failure; keep them reachable.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
